<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Absensi Karyawan (Supabase)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-2 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto bg-white p-3 md:p-6 rounded-xl shadow-lg border border-gray-100">
        <h1 class="text-2xl md:text-3xl font-extrabold mb-4 md:mb-6 text-gray-800 tracking-tight text-center md:text-left">Kalender Absensi</h1>
        
        <!-- TABS NAVIGASI -->
        <div class="flex border-b border-gray-200 mb-4 md:mb-6">
            <button id="tabReguler" class="w-1/2 py-2 md:py-3 text-sm md:text-base font-bold text-center border-b-2 border-blue-500 text-blue-600 transition-colors">Karyawan Reguler</button>
            <button id="tabPartTime" class="w-1/2 py-2 md:py-3 text-sm md:text-base font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors">Karyawan Part Time</button>
        </div>
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-4 md:mb-6 p-3 md:p-5 bg-blue-50/50 border border-blue-100 rounded-xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 w-full">
                <div>
                    <label class="block text-xs md:text-sm font-semibold text-gray-700 mb-1">Pilih Karyawan:</label>
                    <select id="employeeSelect" class="w-full p-2 md:p-2.5 text-sm md:text-base border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"></select>
                </div>
                <div>
                    <label class="block text-xs md:text-sm font-semibold text-gray-700 mb-1">Pilih Periode:</label>
                    <select id="periodFilter" class="w-full p-2 md:p-2.5 text-sm md:text-base border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"></select>
                </div>
            </div>
            <div class="mt-4 md:mt-0 md:ml-8 w-full md:w-auto text-center grid grid-cols-3 gap-2 md:gap-6 bg-white p-2 md:p-4 rounded-lg shadow-sm border border-gray-100">
                <div class="flex flex-col items-center justify-center">
                    <span class="block text-[10px] md:text-xs font-semibold text-gray-500 uppercase tracking-wider mb-0.5 md:mb-1">Selisih Jam</span>
                    <span id="diffHoursDisplay" class="text-lg md:text-2xl font-black text-blue-600">0.00</span>
                </div>
                <div class="flex flex-col items-center justify-center border-l border-gray-200 pl-2 md:pl-4">
                    <span class="block text-[10px] md:text-xs font-semibold text-gray-500 uppercase tracking-wider mb-0.5 md:mb-1">Hadir/Target</span>
                    <span id="attendanceSummary" class="text-lg md:text-2xl font-black text-emerald-600">0/0</span>
                </div>
                <div class="flex flex-col items-center justify-center border-l border-gray-200 pl-2 md:pl-4">
                    <span class="block text-[10px] md:text-xs font-semibold text-gray-500 uppercase tracking-wider mb-0.5 md:mb-1">Izin/Bolos</span>
                    <span id="absenceSummary" class="text-lg md:text-2xl font-black text-rose-600">0</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-7 gap-1 md:gap-2 text-center text-xs md:text-sm font-bold mb-2 md:mb-3">
            <div class="p-1.5 md:p-3 bg-red-100 text-red-700 rounded-lg shadow-sm"><span class="md:hidden">Min</span><span class="hidden md:inline">Ahad</span></div>
            <div class="p-1.5 md:p-3 bg-gray-100 text-gray-700 rounded-lg shadow-sm"><span class="md:hidden">Sen</span><span class="hidden md:inline">Senin</span></div>
            <div class="p-1.5 md:p-3 bg-gray-100 text-gray-700 rounded-lg shadow-sm"><span class="md:hidden">Sel</span><span class="hidden md:inline">Selasa</span></div>
            <div class="p-1.5 md:p-3 bg-gray-100 text-gray-700 rounded-lg shadow-sm"><span class="md:hidden">Rab</span><span class="hidden md:inline">Rabu</span></div>
            <div class="p-1.5 md:p-3 bg-gray-100 text-gray-700 rounded-lg shadow-sm"><span class="md:hidden">Kam</span><span class="hidden md:inline">Kamis</span></div>
            <div class="p-1.5 md:p-3 bg-gray-100 text-gray-700 rounded-lg shadow-sm"><span class="md:hidden">Jum</span><span class="hidden md:inline">Jumat</span></div>
            <div class="p-1.5 md:p-3 bg-gray-100 text-gray-700 rounded-lg shadow-sm"><span class="md:hidden">Sab</span><span class="hidden md:inline">Sabtu</span></div>
        </div>

        <div id="calendarView" class="grid grid-cols-7 gap-1 md:gap-2 text-center text-sm"></div>

        <div class="mt-6 md:mt-8 pt-4 md:pt-6 border-t border-gray-200 flex flex-wrap gap-2 md:gap-6 text-[10px] md:text-xs font-medium text-gray-600 justify-center">
            <div class="flex items-center px-2 md:px-3 py-1 md:py-1.5 bg-gray-50 rounded-full border border-gray-100"><span class="w-3 h-3 md:w-3.5 md:h-3.5 bg-emerald-500 mr-1.5 md:mr-2 rounded-full shadow-sm"></span>Lengkap</div>
            <div class="flex items-center px-2 md:px-3 py-1 md:py-1.5 bg-gray-50 rounded-full border border-gray-100"><span class="w-3 h-3 md:w-3.5 md:h-3.5 bg-amber-400 mr-1.5 md:mr-2 rounded-full shadow-sm"></span>Hanya Masuk</div>
            <div class="flex items-center px-2 md:px-3 py-1 md:py-1.5 bg-gray-50 rounded-full border border-gray-100"><span class="w-3 h-3 md:w-3.5 md:h-3.5 bg-rose-500 mr-1.5 md:mr-2 rounded-full shadow-sm"></span>Hanya Keluar</div>
            <div class="flex items-center px-2 md:px-3 py-1 md:py-1.5 bg-gray-50 rounded-full border border-gray-100"><span class="w-3 h-3 md:w-3.5 md:h-3.5 bg-blue-300 mr-1.5 md:mr-2 rounded-full shadow-sm"></span>Libur Bersama</div>
            <!-- Legenda Khusus Part Time -->
            <div class="flex items-center px-2 md:px-3 py-1 md:py-1.5 bg-rose-50 rounded-full border border-rose-100 text-rose-700"><span class="w-3 h-3 md:w-3.5 md:h-3.5 bg-rose-500 mr-1.5 md:mr-2 rounded-full shadow-sm animate-pulse"></span>Target Wajib (Part Time)</div>
            <div class="flex items-center px-2 md:px-3 py-1 md:py-1.5 bg-emerald-50 rounded-full border border-emerald-100 text-emerald-700"><span class="w-3 h-3 md:w-3.5 md:h-3.5 bg-emerald-400 mr-1.5 md:mr-2 rounded-full shadow-sm"></span>Tercover Surplus (Part Time)</div>
        </div>
        <div class="flex items-center px-2 md:px-3 py-1 md:py-1.5 bg-blue-50 rounded-full border border-blue-100 text-blue-700"><span class="w-3 h-3 md:w-3.5 md:h-3.5 bg-blue-500 mr-1.5 md:mr-2 rounded-full shadow-sm"></span>Hadir Luar Shift (+ Surplus)</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tigszfvmbpvznotykryx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpZ3N6ZnZtYnB2em5vdHlrcnl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MzQwMjcsImV4cCI6MjA5OTMxMDAyN30.O0-y9FI_sikkPVig2XNDJ_zlTnfJZv-hRirPurs8yQc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let karyawanData = {};
        let absensiData = [];
        let hariLibur = new Set();
        let currentTab = 'reguler';

        document.getElementById('tabReguler').addEventListener('click', () => setTab('reguler'));
        document.getElementById('tabPartTime').addEventListener('click', () => setTab('parttime'));

        function setTab(tab) {
            currentTab = tab;
            const tReguler = document.getElementById('tabReguler');
            const tPartTime = document.getElementById('tabPartTime');
            
            if(tab === 'reguler') {
                tReguler.className = "w-1/2 py-2 md:py-3 text-sm md:text-base font-bold text-center border-b-2 border-blue-500 text-blue-600 transition-colors";
                tPartTime.className = "w-1/2 py-2 md:py-3 text-sm md:text-base font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors";
            } else {
                tPartTime.className = "w-1/2 py-2 md:py-3 text-sm md:text-base font-bold text-center border-b-2 border-blue-500 text-blue-600 transition-colors";
                tReguler.className = "w-1/2 py-2 md:py-3 text-sm md:text-base font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors";
            }
            populateEmployeeSelect();
        }

        function populateEmployeeSelect() {
            const select = document.getElementById('employeeSelect');
            select.innerHTML = '<option value="" disabled selected>-- Pilih Karyawan --</option>';
            
            Object.entries(karyawanData).forEach(([id, info]) => {
                const isPartTime = info.position === 'Staf Part Time';
                if ((currentTab === 'parttime' && isPartTime) || (currentTab === 'reguler' && !isPartTime)) {
                    select.innerHTML += `<option value="${id}">${info.nama}</option>`;
                }
            });

            const savedKaryawan = localStorage.getItem('selectedKaryawan');
            if (savedKaryawan && karyawanData[savedKaryawan]) {
                const isSavedPartTime = karyawanData[savedKaryawan].position === 'Staf Part Time';
                if ((currentTab === 'parttime' && isSavedPartTime) || (currentTab === 'reguler' && !isSavedPartTime)) {
                    select.value = savedKaryawan;
                    updatePeriods();
                    return;
                }
            }
            
            document.getElementById('calendarView').innerHTML = '<div class="col-span-7 py-8 md:py-12 text-gray-500 text-sm md:text-base font-semibold flex items-center justify-center text-center px-4 rounded-xl border-2 border-dashed border-gray-300 bg-gray-50">Silakan pilih karyawan pada menu di atas untuk melihat kalender absensi.</div>';
            document.getElementById('periodFilter').innerHTML = '';
            document.getElementById('diffHoursDisplay').innerText = "0.00";
            document.getElementById('attendanceSummary').innerText = "0/0";
            document.getElementById('absenceSummary').innerText = "0";
        }

        async function fetchData() {
            try {
                document.getElementById('calendarView').innerHTML = '<div class="col-span-7 py-10 text-gray-500 text-lg flex items-center justify-center"><svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memuat Data...</div>';

                const [
                    { data: employees, error: errEmp },
                    { data: attendance, error: errAtt },
                    { data: holidays, error: errHol }
                ] = await Promise.all([
                    supabaseClient
                        .from('employees')
                        .select('code, name, working_hours, start_date, position, shift_type')
                        .not('check_in_target', 'is', null)
                        .not('check_out_target', 'is', null),
                    supabaseClient.from('attendance').select('date, "employeeCode", "checkIn", "checkOut"'),
                    supabaseClient.from('holidays').select('start_date, end_date')
                ]);

                if (errEmp) throw errEmp;
                if (errAtt) throw errAtt;
                if (errHol) throw errHol;

                employees.forEach(emp => {
                    const noid = emp.code;
                    const jamKerja = parseFloat(emp.working_hours) || 8;
                    const startStr = emp.start_date || '2024-01-01';
                    const [y, m, d] = startStr.split('-').map(Number);
                    const start = new Date(Date.UTC(y, m - 1, d));
                    
                    if (noid && !isNaN(start.getTime())) {
                        karyawanData[noid] = { 
                            nama: emp.name, 
                            start, 
                            jamKerja,
                            position: emp.position,
                            shift_type: emp.shift_type
                        };
                    }
                });

                absensiData = attendance || [];

                hariLibur.clear();
                (holidays || []).forEach(h => {
                    const startStr = h.start_date.split(' ')[0].split('T')[0]; 
                    const endStr = (h.end_date || h.start_date).split(' ')[0].split('T')[0];
                    
                    let dStart = new Date(startStr + 'T00:00:00Z');
                    let dEnd = new Date(endStr + 'T00:00:00Z');
                    
                    for (let d = new Date(dStart); d <= dEnd; d.setUTCDate(d.getUTCDate() + 1)) {
                        hariLibur.add(d.toISOString().split('T')[0]);
                    }
                });
                
                document.getElementById('employeeSelect').addEventListener('change', (e) => {
                    localStorage.setItem('selectedKaryawan', e.target.value);
                    updatePeriods();
                });
                document.getElementById('periodFilter').addEventListener('change', renderCalendar);
                
                const savedKaryawan = localStorage.getItem('selectedKaryawan');
                if (savedKaryawan && karyawanData[savedKaryawan]) {
                    currentTab = karyawanData[savedKaryawan].position === 'Staf Part Time' ? 'parttime' : 'reguler';
                }
                
                setTab(currentTab);

            } catch (e) { 
                console.error("Gagal load Supabase:", e); 
                document.getElementById('calendarView').innerHTML = '<div class="col-span-7 py-10 text-red-500 font-semibold text-center">Gagal memuat data dari Database Supabase. Cek console untuk error.</div>';
            }
        }

        function hitungDurasiDecimal(jamMasuk, jamKeluar) {
            const [h1, m1] = jamMasuk.split(':').map(Number);
            const [h2, m2] = jamKeluar.split(':').map(Number);
            if(isNaN(h1) || isNaN(h2)) return 0;
            let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff < 0) diff += 24 * 60; 
            return diff / 60;
        }

        function updatePeriods() {
            const noid = document.getElementById('employeeSelect').value;
            const filter = document.getElementById('periodFilter');
            filter.innerHTML = '';
            const start = karyawanData[noid]?.start;
            if (!start) return;

            const today = new Date();
            const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
            let currentPeriodIdx = 0;

            for (let i = 0; i < 12; i++) {
                const dStart = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i, start.getUTCDate()));
                const dEnd = new Date(Date.UTC(dStart.getUTCFullYear(), dStart.getUTCMonth() + 1, dStart.getUTCDate() - 1));
                const label = `Periode ${dStart.getUTCDate()} ${dStart.toLocaleString('id-ID', {month:'short', timeZone: 'UTC'})} - ${dEnd.getUTCDate()} ${dEnd.toLocaleString('id-ID', {month:'short', timeZone: 'UTC'})} ${dEnd.getUTCFullYear()}`;
                
                if (todayUTC >= dStart) {
                    currentPeriodIdx = i;
                }
                filter.innerHTML += `<option value="${i}">${label}</option>`;
            }
            filter.value = currentPeriodIdx; 
            renderCalendar();
        }

 function renderCalendar() {
    const noid = document.getElementById('employeeSelect').value;
    const periodIdx = parseInt(document.getElementById('periodFilter').value);
    const kary = karyawanData[noid];
    const view = document.getElementById('calendarView');
    view.innerHTML = '';
    
    if(!kary) return;

    const isPartTime = kary.position === 'Staf Part Time';
    const shiftDays = parseInt(kary.shift_type) === 2 ? [4, 5, 6] : [1, 2, 3];

    const today = new Date();
    const dStart = new Date(Date.UTC(kary.start.getUTCFullYear(), kary.start.getUTCMonth() + periodIdx, kary.start.getUTCDate()));
    const dEnd = new Date(Date.UTC(dStart.getUTCFullYear(), dStart.getUTCMonth() + 1, dStart.getUTCDate() - 1));

    const msPerDay = 1000 * 60 * 60 * 24;
    const daysInPeriod = Math.round((dEnd - dStart) / msPerDay) + 1;

    const dailyData = {};
    absensiData.filter(r => r.employeeCode === noid).forEach(r => {
        dailyData[r.date] = { 
            jam: {
                masuk: (r.checkIn && r.checkIn !== '--') ? r.checkIn : null,
                keluar: (r.checkOut && r.checkOut !== '--') ? r.checkOut : null
            } 
        };
    });

    // ====================================================================
    // PASS 1: KALKULASI SURPLUS MINGGUAN & HARI WAJIB PART-TIME
    // ====================================================================
    let wajibDaysSet = new Set();
    let coveredDaysSet = new Set();
    
    if (isPartTime) {
        let weeks = [];
        let currentWeek = { targetDays: [], attendedDays: [] };
        
        for (let i = 0; i < daysInPeriod; i++) {
            const d = new Date(Date.UTC(dStart.getUTCFullYear(), dStart.getUTCMonth(), dStart.getUTCDate() + i));
            const dateStr = d.toISOString().split('T')[0];
            const isAhad = d.getUTCDay() === 0;
            const dayOfWeek = d.getUTCDay();
            const isLibur = hariLibur.has(dateStr);
            const data = dailyData[dateStr];
            const hasMasuk = data && (data.jam.masuk || data.jam.keluar);
            
            // Catat hari target (jika hari tersebut adalah jadwal shift & bukan libur)
            if (!isLibur && shiftDays.includes(dayOfWeek)) {
                currentWeek.targetDays.push(dateStr);
            }
            // Catat kehadiran di hari APAPUN (termasuk di luar shift) 
            if (hasMasuk) {
                currentWeek.attendedDays.push(dateStr);
            }
            
            if (isAhad || i === daysInPeriod - 1) {
                weeks.push(currentWeek);
                currentWeek = { targetDays: [], attendedDays: [] };
            }
        }
        
        let balanceSurplus = 0; 
        weeks.forEach(w => {
            const requiredCount = Math.max(0, w.targetDays.length - Math.max(0, balanceSurplus));
            
            w.targetDays.forEach((td, index) => {
                if (index < requiredCount) {
                    wajibDaysSet.add(td);
                } else {
                    coveredDaysSet.add(td); // Tercover oleh surplus
                }
            });
            
            balanceSurplus = balanceSurplus + w.attendedDays.length - w.targetDays.length;
        });
    }

    // ====================================================================
    // PASS 2: RENDER CALENDAR
    // ====================================================================
    let totalDurasi = 0, hariMasuk = 0, totalHariKerja = 0, hariBolos = 0, dataLengkap = true;

    const offset = dStart.getUTCDay();
    for(let i = 0; i < offset; i++) {
        view.innerHTML += `<div class="p-1 md:p-2 rounded-lg md:rounded-xl bg-transparent min-h-[70px] md:min-h-[95px]"></div>`;
    }

    const formatWaktu = (waktu) => {
        if (!waktu) return "";
        const p = waktu.split(':');
        return p.length >= 2 ? `${parseInt(p[0], 10)}:${p[1]}` : waktu;
    };

    for (let i = 0; i < daysInPeriod; i++) {
        const d = new Date(Date.UTC(dStart.getUTCFullYear(), dStart.getUTCMonth(), dStart.getUTCDate() + i));
        const dateStr = d.toISOString().split('T')[0];
        const data = dailyData[dateStr];
        
        const isAhad = d.getUTCDay() === 0;
        const dayOfWeek = d.getUTCDay();
        const isLibur = hariLibur.has(dateStr);

        const hasMasuk = data && data.jam.masuk;
        const hasKeluar = data && data.jam.keluar;
        const attendedAny = hasMasuk || hasKeluar;
        
        const isWajib = isPartTime && wajibDaysSet.has(dateStr);
        const isCovered = isPartTime && coveredDaysSet.has(dateStr);
        
        // Logika Baru: Deteksi Kehadiran Ekstra (Menambah Surplus)
        const isExtraShift = isPartTime && attendedAny && !shiftDays.includes(dayOfWeek);

        // Perbaikan Rekap Totalan (Summary Atas)
        if (d <= today) {
            if (isPartTime) {
                if (shiftDays.includes(dayOfWeek) && !isLibur) totalHariKerja++; 
                if (attendedAny) hariMasuk++;
            } else {
                if (!isAhad && !isLibur) {
                    totalHariKerja++;
                    if (attendedAny) hariMasuk++;
                    else hariBolos++;
                } else {
                    if (attendedAny) hariMasuk++; // Jika dipaksa masuk saat libur/ahad
                }
            }
        }

        let bg = 'bg-white border-gray-200', info = "";
        let indicator = "";

        // Penambahan Visual Indikator Biru (+)
        if (isPartTime) {
            if (isWajib) {
                indicator = `<span class="absolute -top-1.5 -right-1.5 md:-top-2 md:-right-2 flex h-3 w-3 md:h-4 md:w-4 z-10" title="Hari Wajib Masuk"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span><span class="relative flex justify-center items-center rounded-full h-full w-full bg-rose-500 shadow border-2 border-white text-[6px] md:text-[8px] text-white font-bold">!</span></span>`;
            } else if (isCovered) {
                indicator = `<span class="absolute -top-1.5 -right-1.5 md:-top-2 md:-right-2 flex h-3 w-3 md:h-4 md:w-4 z-10" title="Shift Tercover Surplus"><span class="relative flex justify-center items-center rounded-full h-full w-full bg-emerald-400 shadow border-2 border-white text-[6px] md:text-[8px] text-white font-bold">✓</span></span>`;
            } else if (isExtraShift) {
                indicator = `<span class="absolute -top-1.5 -left-1.5 md:-top-2 md:-left-2 flex h-3 w-3 md:h-4 md:w-4 z-10" title="Kehadiran Ekstra (Menambah Surplus)"><span class="relative flex justify-center items-center rounded-full h-full w-full bg-blue-500 shadow border-2 border-white text-[6px] md:text-[8px] text-white font-bold">+</span></span>`;
            }
        }

        if (isLibur) {
            bg = 'bg-blue-200 border-blue-400 shadow-sm text-blue-900';
            if (hasMasuk || hasKeluar) {
                let textDurasi = "";
                if (hasMasuk && hasKeluar) {
                    const durasi = hitungDurasiDecimal(data.jam.masuk, data.jam.keluar);
                    totalDurasi += durasi;
                    textDurasi = `<div class="mt-1 px-1 bg-white/40 rounded text-[9px] md:text-[11px] font-bold">${durasi.toFixed(2)}j</div>`;
                }
                info = indicator + `
                    <div class="text-[9px] md:text-[11px] font-medium mt-0.5 opacity-90">M ${formatWaktu(data.jam.masuk)}</div>
                    <div class="text-[9px] md:text-[11px] font-medium opacity-90">K ${formatWaktu(data.jam.keluar)}</div>
                    ${textDurasi}`;
            } else {
                info = indicator + `<div class="text-[9px] md:text-[10px] mt-2 font-bold opacity-75">LIBUR</div>`;
            }
        } else if (hasMasuk && hasKeluar) {
            bg = 'bg-emerald-500 border-emerald-600 text-white shadow-md transform transition hover:scale-105';
            const durasi = hitungDurasiDecimal(data.jam.masuk, data.jam.keluar);
            totalDurasi += durasi;
            info = indicator + `
                <div class="text-[9px] md:text-[11px] leading-tight font-medium opacity-90 mt-0.5 md:mt-1">M ${formatWaktu(data.jam.masuk)}</div>
                <div class="text-[9px] md:text-[11px] leading-tight font-medium opacity-90">K ${formatWaktu(data.jam.keluar)}</div>
                <div class="mt-1 md:mt-1.5 px-1 md:px-2 py-0.5 bg-white/20 backdrop-blur-sm rounded md:rounded-md text-[9px] md:text-[12px] font-bold shadow-sm">${durasi.toFixed(2)}j</div>`;
        } else if (hasMasuk) {
            bg = 'bg-amber-400 border-amber-500 text-amber-900 shadow-md';
            info = indicator + `<div class="text-[9px] md:text-[11px] font-semibold mt-1 md:mt-2 bg-white/30 px-1 md:px-2 py-0.5 md:py-1 rounded md:rounded-md">M ${formatWaktu(data.jam.masuk)}</div>`;
            dataLengkap = false;
        } else if (hasKeluar) {
            bg = 'bg-rose-500 border-rose-600 text-white shadow-md';
            info = indicator + `<div class="text-[9px] md:text-[11px] font-semibold mt-1 md:mt-2 bg-white/20 px-1 md:px-2 py-0.5 md:py-1 rounded md:rounded-md">K ${formatWaktu(data.jam.keluar)}</div>`;
            dataLengkap = false;
        } else if (d < today && !isLibur && !isAhad) {
            if (isPartTime) {
                if (isWajib) {
                    bg = 'bg-red-50 border-red-200 text-red-500 shadow-inner';
                    info = indicator + `<div class="text-[9px] md:text-[10px] mt-2 font-bold opacity-80 text-red-600">ALFA</div>`;
                } else if (isCovered) {
                    bg = 'bg-emerald-50 border-emerald-100 text-emerald-600 opacity-90';
                    info = indicator + `<div class="text-[8px] md:text-[9px] mt-2 font-bold opacity-80 text-emerald-700">BEBAS</div>`;
                } else {
                    bg = 'bg-gray-50 border-gray-100 text-gray-300 opacity-70'; 
                }
            } else {
                bg = 'bg-gray-100 border-gray-200 text-gray-400';
            }
        } else if (isAhad) {
            bg = 'bg-red-50 border-red-100 text-red-400';
        } else if (d >= today) {
            info = indicator + info;
        }
        
        view.innerHTML += `
            <div class="p-1 md:p-2 border rounded-lg md:rounded-xl relative ${bg} min-h-[70px] md:min-h-[95px] flex flex-col items-center justify-start pt-1.5 md:pt-3 transition-colors duration-200">
                <span class="font-extrabold text-xs md:text-lg">${d.getUTCDate()}</span>
                ${info}
            </div>`;
    }
    
    if (isPartTime) {
        hariBolos = Math.max(0, totalHariKerja - hariMasuk);
    }

    const selisih = totalDurasi - (hariMasuk * kary.jamKerja);
    const diffDisplay = document.getElementById('diffHoursDisplay');
    
    if (dataLengkap) {
        diffDisplay.innerText = selisih.toFixed(2);
        diffDisplay.className = selisih >= 0 ? "text-lg md:text-2xl font-black text-emerald-600" : "text-lg md:text-2xl font-black text-rose-600";
    } else {
        diffDisplay.innerText = "Tdk Lengkap";
        diffDisplay.className = "text-[10px] md:text-sm font-bold text-amber-600 flex items-center h-full text-center leading-tight justify-center";
    }
    
    document.getElementById('attendanceSummary').innerText = `${hariMasuk}/${totalHariKerja}`;
    document.getElementById('absenceSummary').innerText = hariBolos;
}

        window.onload = fetchData;
    </script>
</body>
</html>
